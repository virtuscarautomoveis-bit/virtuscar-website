
<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia VirtusCar</title>

    <style>
        :root {
            --gold: #c9a45c;
            --gold-light: #e5ca8d;
            --dark: #101114;
            --panel: #191b20;
            --text: #f5f2eb;
            --muted: #a7a7a7;
            --green: #39b979;
            --blue: #4b9ce2;
            --red: #d96b6b;
            --border: #34363d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--dark);
            color: var(--text);
            font-family: Arial, Helvetica, sans-serif;
            padding: 35px 18px 60px;
        }

        .container {
            width: 100%;
            max-width: 1150px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand {
            color: var(--gold);
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        h1 {
            font-size: clamp(30px, 5vw, 46px);
            margin-bottom: 12px;
        }

        h1 span {
            color: var(--gold);
        }

        .subtitle {
            color: var(--muted);
            line-height: 1.6;
            font-size: 15px;
        }

        .overall {
            background: linear-gradient(135deg, #24252a, #17181c);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 23px;
            margin-bottom: 30px;
        }

        .overall-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .overall-top strong {
            font-size: 16px;
        }

        #overallPercent {
            color: var(--gold-light);
            font-size: 23px;
            font-weight: bold;
        }

        .progress-track {
            width: 100%;
            height: 9px;
            background: #36383e;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg, #a77c35, #e5ca8d);
            border-radius: 20px;
            transition: width .3s ease;
        }

        #overallDetails {
            color: var(--muted);
            font-size: 13px;
            margin-top: 11px;
        }

        .section-title {
            color: var(--gold-light);
            font-size: 19px;
            margin-bottom: 18px;
        }

        .modules-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 18px;
        }

        .module-card {
            display: block;
            text-decoration: none;
            color: var(--text);
            background: var(--panel);
            border: 1px solid var(--border);
            border-left: 5px solid #555963;
            border-radius: 13px;
            padding: 22px;
            min-height: 205px;
            transition: transform .2s ease, border-color .2s ease, background .2s ease;
        }

        .module-card:not(.locked):hover {
            transform: translateY(-3px);
            background: #202228;
        }

        .module-card.completed {
            border-color: rgba(57, 185, 121, .65);
            border-left-color: var(--green);
            background: linear-gradient(135deg, #17241f, #191b20);
        }

        .module-card.available {
            border-color: rgba(75, 156, 226, .65);
            border-left-color: var(--blue);
        }

        .module-card.in-progress {
            border-left-color: var(--gold);
        }

        .module-card.locked {
            border-left-color: var(--red);
            opacity: .72;
            cursor: not-allowed;
        }

        .module-number {
            color: var(--gold);
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 12px;
        }

        .module-card h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .module-description {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.55;
            min-height: 40px;
        }

        .module-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 19px;
        }

        .module-count {
            color: var(--muted);
            font-size: 12px;
        }

        .module-status {
            display: inline-block;
            border-radius: 20px;
            padding: 7px 11px;
            font-size: 11px;
            font-weight: bold;
            background: #34363d;
            color: #ddd;
        }

        .completed .module-status {
            background: rgba(57, 185, 121, .15);
            color: #65d69c;
        }

        .available .module-status {
            background: rgba(75, 156, 226, .15);
            color: #80baf0;
        }

        .in-progress .module-status {
            background: rgba(201, 164, 92, .15);
            color: var(--gold-light);
        }

        .locked .module-status {
            background: rgba(217, 107, 107, .13);
            color: #e99494;
        }

        .module-progress {
            height: 5px;
            background: #34363d;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 17px;
        }

        .module-progress-fill {
            height: 100%;
            background: var(--gold);
            width: 0;
        }

        .completed .module-progress-fill {
            background: var(--green);
        }

        .available .module-progress-fill {
            background: var(--blue);
        }

        .locked .module-progress-fill {
            background: var(--red);
        }

        .footer {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 35px;
        }

        @media (max-width: 700px) {
            body {
                padding: 25px 13px 45px;
            }

            .modules-grid {
                grid-template-columns: 1fr;
            }

            .module-card {
                min-height: 0;
            }
        }
    </style>
</head>

<body>
    <main class="container">

        <header class="header">
            <div class="brand">VirtusCar</div>
            <h1>Academia <span>VirtusCar</span></h1>
            <p class="subtitle">
                Formação, desenvolvimento e excelência profissional.
                Acompanha aqui a tua evolução na Academia.
            </p>
        </header>

        <section class="overall">
            <div class="overall-top">
                <strong>Progresso geral da formação</strong>
                <span id="overallPercent">0%</span>
            </div>

            <div class="progress-track">
                <div class="progress-fill" id="overallBar"></div>
            </div>

            <p id="overallDetails">A carregar progresso...</p>
        </section>

        <h2 class="section-title">Os teus módulos</h2>

        <section class="modules-grid" id="modulesGrid"></section>

        <footer class="footer">
            Academia VirtusCar · Sistema de formação e avaliação
        </footer>

    </main>

    <script src="progress.js"></script>

    <script>
    (function () {
        "use strict";

        const VP = window.VirtusCarProgress;

        if (!VP) {
            document.getElementById("modulesGrid").innerHTML =
                "<p>Não foi possível carregar o sistema de progresso. Confirma se o ficheiro progress.js está na mesma pasta.</p>";
            return;
        }

        const modulos = [
            {
                numero: 1,
                titulo: "Fundamentos da VirtusCar",
                descricao: "Conhece o conceito, o modelo de negócio e os princípios fundamentais da VirtusCar.",
                primeiraAula: "aula-01",
                teste: "teste-01.html"
            },
            {
                numero: 2,
                titulo: "Angariação de Viaturas",
                descricao: "Aprende a identificar oportunidades e a trabalhar com proprietários de viaturas.",
                primeiraAula: "aula-05",
                teste: "teste-02.html"
            },
            {
                numero: 3,
                titulo: "Processo Comercial",
                descricao: "Desenvolve competências de comunicação, contacto e acompanhamento comercial.",
                primeiraAula: "aula-11",
                teste: "teste-03.html"
            },
            {
                numero: 4,
                titulo: "Gestão de Clientes",
                descricao: "Aprende a organizar contactos, acompanhar clientes e gerir relações comerciais.",
                primeiraAula: "aula-17",
                teste: "teste-04.html"
            },
            {
                numero: 5,
                titulo: "Negociação e Venda",
                descricao: "Domina as etapas de negociação, apresentação de propostas e fecho de vendas.",
                primeiraAula: "aula-23",
                teste: "teste-05.html"
            },
            {
                numero: 6,
                titulo: "Gestão e Desenvolvimento do Consultor",
                descricao: "Consolida a organização, gestão de oportunidades, desempenho e ética profissional.",
                primeiraAula: "aula-29",
                teste: "teste-06.html"
            }
        ];

        function atualizarAcademia() {
            const grelha = document.getElementById("modulesGrid");
            grelha.innerHTML = "";

            modulos.forEach(modulo => {
                const n = modulo.numero;
                const progresso = VP["obterProgressoModulo0" + n]();
                const desbloqueado = VP["modulo0" + n + "Desbloqueado"]();
                const aprovado = VP["teste0" + n + "Aprovado"]();

                const todasAulas = progresso.aulasConcluidas === 4 + (n === 1 ? 0 : 2);
                // Todos os módulos têm seis aulas, excepto o primeiro, que tem quatro.
                const totalAulas = n === 1 ? 4 : 6;
                const aulasConcluidas = progresso.aulasConcluidas;
                const aulasTerminadas = aulasConcluidas === totalAulas;

                let estado = "Bloqueado";
                let classe = "locked";
                let destino = "#";

                if (aprovado) {
                    estado = "Concluído";
                    classe = "completed";
                    destino = modulo.teste;
                } else if (desbloqueado) {
                    if (aulasTerminadas) {
                        estado = "Teste disponível";
                        classe = "available";
                        destino = modulo.teste;
                    } else if (aulasConcluidas > 0) {
                        estado = "Em progresso";
                        classe = "in-progress";

                        for (let i = 1; i <= totalAulas; i++) {
                            const numeroAula = (n === 1 ? 0 : (n - 1) * 6) + i;
                            const aula = "aula-" + String(numeroAula).padStart(2, "0");

                            if (!VP.aulaConcluida(aula)) {
                                destino = aula + ".html";
                                break;
                            }
                        }
                    } else {
                        estado = "Disponível";
                        classe = "available";
                        destino = modulo.primeiraAula + ".html";
                    }
                }

                const cartao = document.createElement("a");
                cartao.className = "module-card " + classe;
                cartao.href = destino;

                if (classe === "locked") {
                    cartao.setAttribute("aria-disabled", "true");
                    cartao.addEventListener("click", function (event) {
                        event.preventDefault();
                    });
                }

                const percentagem = Math.round(
                    (aulasConcluidas + (aprovado ? 1 : 0)) /
                    (totalAulas + 1) * 100
                );

                cartao.innerHTML = `
                    <div class="module-number">MÓDULO 0${n}</div>
                    <h3>${modulo.titulo}</h3>
                    <p class="module-description">${modulo.descricao}</p>

                    <div class="module-bottom">
                        <span class="module-count">
                            ${totalAulas} aulas + ${n === 6 ? "avaliação final" : "teste"}
                        </span>
                        <span class="module-status">${estado}</span>
                    </div>

                    <div class="module-progress">
                        <div class="module-progress-fill" style="width:${percentagem}%"></div>
                    </div>
                `;

                grelha.appendChild(cartao);
            });

            const geral = VP.obterProgressoGeral();

            document.getElementById("overallPercent").textContent =
                geral.percentagem + "%";

            document.getElementById("overallBar").style.width =
                geral.percentagem + "%";

            document.getElementById("overallDetails").textContent =
                geral.concluidas + " de " + geral.total +
                " etapas concluídas (aulas e testes).";
        }

        atualizarAcademia();
    })();
    </script>
</body>
</html>
