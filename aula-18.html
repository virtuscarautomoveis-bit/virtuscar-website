
<script src="progress.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const completeButton = document.getElementById("completeButton");
    const nextButton = document.getElementById("nextButton");
    const completionMessage = document.getElementById("completionMessage");

    const aula = "aula-18";
    const chaveAntiga = "virtuscar_aula_18";

    function mostrarAulaConcluida() {
        completeButton.style.display = "none";
        completionMessage.style.display = "block";
        nextButton.style.display = "inline-block";
    }

    function concluirAula18() {
        try {
            // Guardar a conclusão no formato antigo.
            localStorage.setItem(chaveAntiga, "true");

            // Atualizar também o progresso central.
            if (
                window.VirtusCarProgress &&
                typeof window.VirtusCarProgress.concluirAula === "function"
            ) {
                const guardado = window.VirtusCarProgress.concluirAula(aula);

                if (guardado === false) {
                    throw new Error("Não foi possível atualizar o progresso central.");
                }
            } else {
                console.warn(
                    "VirtusCarProgress não está disponível. Verifica o caminho de progress.js."
                );
            }

            mostrarAulaConcluida();

        } catch (erro) {
            console.error("Erro ao concluir a Aula 18:", erro);
            completionMessage.textContent =
                "Não foi possível confirmar o progresso. Atualiza a página e tenta novamente.";
            completionMessage.style.display = "block";
        }
    }

    // Recuperar a conclusão guardada anteriormente.
    const concluidaAntigamente =
        localStorage.getItem(chaveAntiga) === "true";

    const concluidaNoSistema =
        window.VirtusCarProgress &&
        typeof window.VirtusCarProgress.aulaConcluida === "function" &&
        window.VirtusCarProgress.aulaConcluida(aula);

    if (concluidaAntigamente || concluidaNoSistema) {
        concluirAula18();
    }

    completeButton.addEventListener("click", function () {
        concluirAula18();
    });
});
</script>
